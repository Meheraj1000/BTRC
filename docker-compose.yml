services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirapad
      POSTGRES_PASSWORD: nirapad_demo_only
      POSTGRES_DB: nirapad_transit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirapad -d nirapad_transit"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nirapad:nirapad_demo_only@db:5432/nirapad_transit?schema=public
      BACKEND_PORT: 4000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  simulator:
    build:
      context: ./gps-simulator
    env_file:
      - .env
    environment:
      SIMULATOR_API_URL: http://backend:4000/api
    depends_on:
      - backend
    profiles:
      - sim
    stdin_open: true
    tty: true

volumes:
  postgres_data:
